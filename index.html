<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME - Gestione Casa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .font-helvetica {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-[#F8F9FA] text-slate-800 pb-16 font-helvetica">

    <!-- Copertina stile rivista di design -->
    <div class="relative w-full h-72 sm:h-80 overflow-hidden shadow-md">
        <img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1200&q=80" 
             alt="Interno casa moderna" class="w-full h-full object-cover">
        
        <div class="absolute inset-0 bg-slate-900/40 flex flex-col items-center justify-center text-center p-6 sm:p-8">
            <span class="text-xs sm:text-sm uppercase tracking-widest text-emerald-300 italic mb-2">
                INTERIOR & MAINTENANCE
            </span>
            <h1 class="text-5xl sm:text-7xl font-bold text-white tracking-tight mb-2">
                HOME
            </h1>
            <p class="text-base sm:text-xl text-slate-100 font-normal">
                Ti aiuto nella gestione della casa
            </p>
        </div>
    </div>

    <div class="max-w-xl mx-auto px-4 sm:px-6 -mt-6 relative z-10">
        
        <!-- Form per registrare un'attività -->
        <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-xl border border-white/50 p-6 mb-6">
            <h2 class="text-xl font-bold text-slate-800 mb-5 flex items-center gap-2.5">
                <span class="w-3 h-3 rounded-full bg-emerald-500"></span> Registra Attività Svolta
            </h2>
            
            <form id="task-form" class="space-y-4">
                <!-- Selezione Stanza / Ambiente -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Ambiente</label>
                    <select id="task-room" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                        <option value="">-- Seleziona Ambiente --</option>
                        <option value="🛏️ Camera matrimoniale">🛏️ Camera matrimoniale</option>
                        <option value="🖥️ Studio">🖥️ Studio</option>
                        <option value="🍳 Cucina">🍳 Cucina</option>
                        <option value="🛋️ Salotto">🛋️ Salotto</option>
                        <option value="🛌 Camera ospiti">🛌 Camera ospiti</option>
                        <option value="🛁 Bagno grande">🛁 Bagno grande</option>
                        <option value="🧼 Bagno ospiti">🧼 Bagno ospiti</option>
                        <option value="🪴 Terrazza grande">🪴 Terrazza grande</option>
                        <option value="🌿 Terrazzino">🌿 Terrazzino</option>
                        <option value="📦 Ripostiglio / Lavanderia">📦 Ripostiglio / Lavanderia</option>
                        <option value="🚗 Garage">🚗 Garage</option>
                    </select>
                </div>

                <!-- Menu a tendina secondario per le attività -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Attività Svolta</label>
                    <select id="task-action" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition disabled:opacity-50" disabled>
                        <option value="">-- Prima seleziona un ambiente --</option>
                    </select>
                </div>

                <!-- Campo note opzionale -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Note aggiuntive (Opzionale)</label>
                    <input type="text" id="task-notes" placeholder="Es. Usato prodotto anticalcare nuovo" 
                           class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                </div>

                <!-- Bottone Invio -->
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-emerald-600/30 transition transform active:scale-95 mt-2">
                    Registra con data di oggi
                </button>
            </form>
        </div>

        <!-- BOTTONE PER APRIRE LO STORICO NASCOSTO -->
        <button onclick="toggleHistoryModal()" class="w-full bg-white hover:bg-slate-50 text-slate-700 font-bold py-4 px-6 rounded-2xl shadow-md border border-slate-200 flex items-center justify-between transition">
            <span class="flex items-center gap-2">
                📜 <span>Consultare lo Storico</span>
            </span>
            <span class="text-xs bg-emerald-100 text-emerald-700 font-bold px-3 py-1 rounded-full" id="history-counter-badge">0 voci</span>
        </button>

    </div>

    <!-- PANNELLO MODALE STORICO (COMPLETAMENTE NASCOSTO DI DEFAULT) -->
    <div id="history-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl max-h-[85vh] flex flex-col overflow-hidden border border-slate-100">
            <!-- Header Modale -->
            <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    📜 Storico Attività per Stanza
                </h3>
                <button onclick="toggleHistoryModal()" class="w-8 h-8 rounded-full bg-slate-200/60 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition">
                    ✕
                </button>
            </div>

            <!-- Contenuto dello Storico con le stanze -->
            <div id="room-history-container" class="p-6 overflow-y-auto space-y-3 flex-1">
                <!-- Inserito dinamicamente -->
            </div>
        </div>
    </div>

    <script>
        const roomActivities = {
            "🛏️ Camera matrimoniale": [
                "pulizia vetri",
                "cambio lenzuola",
                "pulizia sopra armadio",
                "pulizia ante interne armadio",
                "pulizia sotto al letto",
                "pulizia testiera",
                "girare materasso",
                "lavaggio tende"
            ],
            "🖥️ Studio": [
                "Pulizia scrivania e monitor",
                "Ordinamento documenti",
                "Spolveratura libreria",
                "Aspirapolvere e lavaggio pavimento"
            ],
            "🍳 Cucina": [
                "Pulizia e sgrassaggio forno",
                "Pulizia microonde",
                "Decalcinazione macchina caffè",
                "Pulizia e riordino frigorifero",
                "Pulizia cappa e filtri",
                "Lavaggio approfondito piani e lavello"
            ],
            "🛋️ Salotto": [
                "Pulizia e aspirazione divano",
                "Lavaggio tende",
                "Pulizia TV e mobile",
                "Aspirapolvere e lavaggio pavimento"
            ],
            "🛌 Camera ospiti": [
                "Cambio lenzuola",
                "Spolveratura generale",
                "Aerazione stanza e aspirapolvere"
            ],
            "🛁 Bagno grande": [
                "Sanificazione sanitari e doccia/vasca",
                "Pulizia vetri box doccia",
                "Decalcinazione rubinetterie",
                "Cambio asciugamani e tappeti",
                "Lavaggio piastrelle e pavimento"
            ],
            "🧼 Bagno ospiti": [
                "Sanificazione sanitari",
                "Pulizia specchio e lavabo",
                "Cambio asciugamani",
                "Lavaggio pavimento"
            ],
            "🪴 Terrazza grande": [
                "Pulizia pavimento ed esterni",
                "Cura e annaffiatura piante",
                "Pulizia arredi da esterno",
                "Pulizia scarichi e grondaie"
            ],
            "🌿 Terrazzino": [
                "Spazzata e lavaggio pavimento",
                "Cura piante",
                "Pulizia parapetto"
            ],
            "📦 Ripostiglio / Lavanderia": [
                "Pulizia filtro lavatrice",
                "Pulizia filtro asciugatrice",
                "Riordino detersivi e scorte",
                "Pulizia scaffali"
            ],
            "🚗 Garage": [
                "Spazzata pavimento",
                "Riordino attrezzi",
                "Controllo e pulizia scaffalature"
            ]
        };

        const roomSelect = document.getElementById('task-room');
        const actionSelect = document.getElementById('task-action');
        const notesInput = document.getElementById('task-notes');
        const taskForm = document.getElementById('task-form');
        const historyContainer = document.getElementById('room-history-container');
        const historyModal = document.getElementById('history-modal');
        const historyCounterBadge = document.getElementById('history-counter-badge');

        let tasks = JSON.parse(localStorage.getItem('home_history_v4')) || [];

        roomSelect.addEventListener('change', () => {
            const selectedRoom = roomSelect.value;
            actionSelect.innerHTML = '';

            if (selectedRoom && roomActivities[selectedRoom]) {
                actionSelect.disabled = false;
                const defaultOption = document.createElement('option');
                defaultOption.value = '';
                defaultOption.textContent = '-- Seleziona attività --';
                actionSelect.appendChild(defaultOption);

                roomActivities[selectedRoom].forEach(act => {
                    const opt = document.createElement('option');
                    opt.value = act;
                    opt.textContent = act;
                    actionSelect.appendChild(opt);
                });
            } else {
                actionSelect.disabled = true;
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '-- Prima seleziona un ambiente --';
                actionSelect.appendChild(opt);
            }
        });

        function getCurrentFormattedDate() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
            return `${dateStr} alle ${timeStr}`;
        }

        function toggleHistoryModal() {
            historyModal.classList.toggle('hidden');
        }

        function renderHistory() {
            historyContainer.innerHTML = '';
            historyCounterBadge.textContent = `${tasks.length} voci`;

            if (tasks.length === 0) {
                historyContainer.innerHTML = `
                    <div class="text-center py-8">
                        <p class="text-slate-400 text-sm">Nessuna attività registrata nello storico.</p>
                    </div>`;
                return;
            }

            const grouped = {};
            tasks.forEach(item => {
                if (!grouped[item.room]) grouped[item.room] = {};
                if (!grouped[item.room][item.action]) grouped[item.room][item.action] = [];
                grouped[item.room][item.action].push(item);
            });

            Object.keys(grouped).forEach((room, roomIdx) => {
                const roomData = grouped[room];
                const totalRoomLogs = Object.values(roomData).reduce((acc, curr) => acc + curr.length, 0);

                const roomCard = document.createElement('div');
                roomCard.className = 'bg-slate-50/80 rounded-2xl border border-slate-200/80 overflow-hidden';

                let activitiesHTML = '';
                Object.keys(roomData).forEach((action, actIdx) => {
                    const logs = roomData[action];
                    
                    let logsHTML = '';
                    logs.forEach(log => {
                        logsHTML += `
                            <div class="flex items-center justify-between text-xs py-2 border-b border-slate-100 last:border-0 pl-3">
                                <div>
                                    <span class="font-medium text-slate-700">📅 ${log.timestamp}</span>
                                    ${log.notes ? `<p class="text-slate-400 italic mt-0.5">"${log.notes}"</p>` : ''}
                                </div>
                                <button onclick="deleteSingleLog('${log.id}')" title="Elimina voce" class="text-slate-300 hover:text-red-500 p-1 transition">
                                    🗑️
                                </button>
                            </div>
                        `;
                    });

                    activitiesHTML += `
                        <div class="border-t border-slate-200/60">
                            <button onclick="toggleAccordion('act-${roomIdx}-${actIdx}')" 
                                    class="w-full text-left px-4 py-3 bg-white hover:bg-slate-100/50 flex items-center justify-between transition">
                                <span class="text-sm font-semibold text-slate-700">🔹 ${action}</span>
                                <div class="flex items-center gap-2">
                                    <span class="text-xs bg-slate-200/70 text-slate-600 px-2 py-0.5 rounded-full font-medium">${logs.length}</span>
                                    <span id="icon-act-${roomIdx}-${actIdx}" class="text-xs text-slate-400 transition-transform inline-block">▶</span>
                                </div>
                            </button>
                            <div id="act-${roomIdx}-${actIdx}" class="hidden px-4 py-2 bg-slate-50/50 space-y-1">
                                ${logsHTML}
                            </div>
                        </div>
                    `;
                });

                roomCard.innerHTML = `
                    <button onclick="toggleAccordion('room-${roomIdx}')" 
                            class="w-full text-left px-5 py-4 bg-slate-100/70 hover:bg-slate-200/50 flex items-center justify-between transition">
                        <span class="font-bold text-slate-800 text-sm sm:text-base">${room}</span>
                        <div class="flex items-center gap-2">
                            <span class="text-xs bg-emerald-100 text-emerald-700 font-bold px-2.5 py-1 rounded-full">${totalRoomLogs} registrazioni</span>
                            <span id="icon-room-${roomIdx}" class="text-xs text-slate-400 transition-transform inline-block">▶</span>
                        </div>
                    </button>
                    <div id="room-${roomIdx}" class="hidden">
                        ${activitiesHTML}
                    </div>
                `;

                historyContainer.appendChild(roomCard);
            });
        }

        function toggleAccordion(id) {
            const el = document.getElementById(id);
            const icon = document.getElementById(`icon-${id}`);
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                if (icon) icon.style.transform = 'rotate(90deg)';
            } else {
                el.classList.add('hidden');
                if (icon) icon.style.transform = 'rotate(0deg)';
            }
        }

        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            if (!roomSelect.value || !actionSelect.value) {
                alert('Seleziona sia l\'ambiente che l\'attività!');
                return;
            }

            const newTask = {
                id: Date.now().toString(),
                room: roomSelect.value,
                action: actionSelect.value,
                notes: notesInput.value.trim(),
                timestamp: getCurrentFormattedDate()
            };

            tasks.unshift(newTask);
            saveAndRender();

            taskForm.reset();
            actionSelect.disabled = true;
            actionSelect.innerHTML = '<option value="">-- Prima seleziona un ambiente --</option>';
        });

        function deleteSingleLog(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('home_history_v4', JSON.stringify(tasks));
            renderHistory();
        }

        renderHistory();
    </script>
</body>
</html>
