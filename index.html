<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME - Gestione Casa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#F8F9FA] text-slate-800 pb-16">

    <!-- Copertina stile rivista di design -->
    <div class="relative w-full h-56 sm:h-72 overflow-hidden shadow-md">
        <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80" 
             alt="Casa moderna" class="w-full h-full object-cover brightness-90">
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-slate-900/30 to-transparent flex flex-col justify-end p-6 sm:p-8">
            <span class="text-xs uppercase tracking-widest text-emerald-400 font-semibold mb-1">Interior & Maintenance</span>
            <h1 class="text-2xl sm:text-4xl font-bold text-white tracking-tight">HOME</h1>
            <p class="text-xs sm:text-sm text-slate-200 mt-1">Ti aiuto nella gestione della casa</p>
        </div>
    </div>

    <div class="max-w-xl mx-auto px-4 sm:px-6 -mt-6 relative z-10">
        
        <!-- Form per aggiungere un'attività -->
        <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-xl border border-white/50 p-6 mb-8">
            <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Aggiungi Intervento
            </h2>
            
            <form id="task-form" class="space-y-4">
                <!-- Selezione Stanza -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Ambiente</label>
                    <select id="task-room" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                        <option value="🛏️ Camera matrimoniale">🛏️ Camera matrimoniale</option>
                        <option value="🖥️ Studio">🖥️ Studio</option>
                        <option value="🍳 Cucina">🍳 Cucina</option>
                        <option value="🛋️ Salotto">🛋️ Salotto</option>
                        <option value="🛌 Camera ospiti">🛌 Camera ospiti</option>
                        <option value="🛁 Bagno grande">🛁 Bagno grande</option>
                        <option value="🧼 Bagno ospiti">🧼 Bagno ospiti</option>
                        <option value="🪴 Terrazza grande">🪴 Terrazza grande</option>
                        <option value="🌿 Terrazza piccola">🌿 Terrazza piccola</option>
                        <option value="🏡 Altro / Generale">🏡 Altro / Generale</option>
                    </select>
                </div>

                <!-- Selezione Attività Predefinita -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Attività / Lavoro</label>
                    <select id="task-template" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                        <!-- Popolato via JS -->
                    </select>
                </div>

                <!-- Campo personalizzato (apparirà se si seleziona Altro) -->
                <div id="custom-task-container" class="hidden">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Specifica personalizzata</label>
                    <input type="text" id="custom-task-name" placeholder="Es. Pulizia profonda lampadari" 
                        class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                </div>
                
                <button type="submit" class="w-full bg-slate-900 text-white font-semibold py-3.5 rounded-2xl text-sm hover:bg-emerald-600 transition shadow-lg shadow-slate-900/10 mt-2">
                    Registra nella lista
                </button>
            </form>
        </div>

        <!-- Lista delle attività raggruppate per ambiente -->
        <div id="task-list" class="space-y-6">
            <!-- Verrà popolato da JavaScript -->
        </div>
    </div>

    <script>
        const roomTemplates = {
            "🛏️ Camera matrimoniale": [
                "Girare materasso",
                "Lavaggio tende",
                "Pulizia sotto il letto",
                "Pulizia vetri",
                "Pulizia sopra armadio",
                "Pulizia interno ante armadio",
                "Altro..."
            ],
            "🖥️ Studio": [
                "Spolverare scrivania e libreria",
                "Pulizia monitor e tastiera",
                "Riordino documenti",
                "Altro..."
            ],
            "🍳 Cucina": [
                "Pulizia filtri cappa",
                "Sbrinare frigorifero",
                "Pulizia forno",
                "Lavaggio filtri lavastoviglie",
                "Altro..."
            ],
            "🛋️ Salotto": [
                "Spolverare mobili e TV",
                "Aspirare divano",
                "Pulizia tappeti",
                "Altro..."
            ],
            "🛌 Camera ospiti": [
                "Cambio lenzuola",
                "Arieggiare e spolverare",
                "Altro..."
            ],
            "🛁 Bagno grande": [
                "Pulizia box doccia e decalcificazione",
                "Pulizia sanitari",
                "Lavaggio tappeti e cambio asciugamani",
                "Altro..."
            ],
            "🧼 Bagno ospiti": [
                "Pulizia sanitari e lavabo",
                "Cambio asciugamani",
                "Altro..."
            ],
            "🪴 Terrazza grande": [
                "Lavaggio pavimento",
                "Cura piante",
                "Pulizia vetri parapetto",
                "Altro..."
            ],
            "🌿 Terrazza piccola": [
                "Lavaggio pavimento",
                "Cura piante",
                "Altro..."
            ],
            "🏡 Altro / Generale": [
                "Controllo caldaia",
                "Controllo condizionatori",
                "Altro..."
            ]
        };

        let tasks = JSON.parse(localStorage.getItem('home_tracker_design_v2')) || [];

        const form = document.getElementById('task-form');
        const taskRoomSelect = document.getElementById('task-room');
        const taskTemplateSelect = document.getElementById('task-template');
        const customTaskContainer = document.getElementById('custom-task-container');
        const customTaskInput = document.getElementById('custom-task-name');
        const taskList = document.getElementById('task-list');

        function updateTemplates() {
            const selectedRoom = taskRoomSelect.value;
            const templates = roomTemplates[selectedRoom] || ["Altro..."];
            
            taskTemplateSelect.innerHTML = '';
            templates.forEach(tpl => {
                const opt = document.createElement('option');
                opt.value = tpl;
                opt.textContent = tpl;
                taskTemplateSelect.appendChild(opt);
            });

            checkCustomTask();
        }

        function checkCustomTask() {
            if (taskTemplateSelect.value === 'Altro...') {
                customTaskContainer.classList.remove('hidden');
                customTaskInput.required = true;
            } else {
                customTaskContainer.classList.add('hidden');
                customTaskInput.required = false;
                customTaskInput.value = '';
            }
        }

        taskRoomSelect.addEventListener('change', updateTemplates);
        taskTemplateSelect.addEventListener('change', checkCustomTask);

        updateTemplates();

        function saveAndRender() {
            localStorage.setItem('home_tracker_design_v2', JSON.stringify(tasks));
            renderTasks();
        }

        function renderTasks() {
            taskList.innerHTML = '';
            
            if (tasks.length === 0) {
                taskList.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-3xl border border-slate-100 p-8 shadow-sm">
                        <p class="text-slate-400 text-sm">Nessuna attività registrata. Scegli stanza e attività qui sopra! ✨</p>
                    </div>`;
                return;
            }

            const grouped = tasks.reduce((acc, task, index) => {
                const room = task.room || '🏡 Altro / Generale';
                if (!acc[room]) acc[room] = [];
                acc[room].push({ ...task, originalIndex: index });
                return acc;
            }, {});

            for (const [room, roomTasks] of Object.entries(grouped)) {
                const roomContainer = document.createElement('div');
                roomContainer.className = 'bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden';

                let tasksHTML = '';
                roomTasks.forEach(task => {
                    const lastDate = task.lastDone ? new Date(task.lastDone).toLocaleDateString('it-IT') : 'Mai fatta';
                    
                    tasksHTML += `
                        <div class="flex items-center justify-between p-4 sm:p-5 border-b border-slate-50 last:border-none hover:bg-slate-50/60 transition">
                            <div>
                                <h4 class="font-semibold text-slate-800 text-sm sm:text-base">${task.name}</h4>
                                <p class="text-xs text-slate-400 mt-0.5">Ultima volta: <span class="font-medium text-slate-600">${lastDate}</span></p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="completeTask(${task.originalIndex})" class="bg-emerald-50 text-emerald-600 border border-emerald-200/60 text-xs font-semibold px-3.5 py-2 rounded-xl hover:bg-emerald-100 transition shadow-sm">
                                    ✓ Fatto oggi
                                </button>
                                <button onclick="deleteTask(${task.originalIndex})" class="text-slate-300 hover:text-rose-500 p-2 rounded-xl transition" title="Elimina">
                                    ✕
                                </button>
                            </div>
                        </div>
                    `;
                });

                roomContainer.innerHTML = `
                    <div class="bg-slate-50/80 px-5 py-3.5 border-b border-slate-100 flex items-center justify-between">
                        <h3 class="font-bold text-slate-700 text-xs sm:text-sm tracking-wider uppercase">${room}</h3>
                        <span class="text-xs bg-white border border-slate-200 text-slate-600 px-2.5 py-0.5 rounded-full font-semibold shadow-xs">${roomTasks.length}</span>
                    </div>
                    <div>${tasksHTML}</div>
                `;

                taskList.appendChild(roomContainer);
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            let taskName = taskTemplateSelect.value;
            if (taskName === 'Altro...') {
                taskName = customTaskInput.value.trim();
            }

            tasks.push({
                name: taskName,
                room: taskRoomSelect.value,
                lastDone: null
            });

            customTaskInput.value = '';
            updateTemplates();
            saveAndRender();
        });

        window.completeTask = function(index) {
            tasks[index].lastDone = new Date().toISOString();
            saveAndRender();
        }

        window.deleteTask = function(index) {
            if (confirm('Vuoi davvero eliminare questa attività?')) {
                tasks.splice(index, 1);
                saveAndRender();
            }
        }

        renderTasks();
    </script>
</body>
</html>
