<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Tracker - Pulizie per Ambienti</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans pb-12">
    <div class="max-w-xl mx-auto p-4 sm:p-6">
        
        <!-- Intestazione -->
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-extrabold text-gray-800">🏠 Home Tracker</h1>
            <p class="text-sm text-gray-500 mt-1">Gestisci pulizie e manutenzioni per ogni ambiente</p>
        </header>

        <!-- Form per aggiungere un'attività -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-6">
            <h2 class="text-lg font-bold text-gray-700 mb-3">Nuova attività</h2>
            <form id="task-form" class="space-y-3">
                <!-- Selezione Stanza -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Seleziona Ambiente</label>
                    <select id="task-room" class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="🛏️ Camera da letto">🛏️ Camera da letto</option>
                        <option value="🖥️ Studio">🖥️ Studio</option>
                        <option value="🍳 Cucina">🍳 Cucina</option>
                        <option value="🛋️ Salotto">🛋️ Salotto</option>
                        <option value="🛌 Camera ospiti">🛌 Camera ospiti</option>
                        <option value="🛁 Bagno grande">🛁 Bagno grande</option>
                        <option value="🧼 Bagno ospiti">🧼 Bagno ospiti</option>
                        <option value="🪴 Terrazza grande">🪴 Terrazza grande</option>
                        <option value="🌿 Terrazza piccola">🌿 Terrazza piccola</option>
                        <option value="🏡 Altro / Generale">🏡 Altro / Generale</option>
                    </select>
                </div>

                <!-- Selezione Attività Predefinita -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Seleziona Attività</label>
                    <select id="task-template" class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <!-- Verrà popolato dinamicamente in base alla stanza -->
                    </select>
                </div>

                <!-- Campo personalizzato (appare se selezioni "Altro...") -->
                <div id="custom-task-container" class="hidden">
                    <label class="block text-xs font-semibold
